<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#123c66">
  <title>Jacky's Service Portal</title>
  <style>
    :root{--navy:#123c66;--blue:#1d6fa5;--line:#d7e1ea;--muted:#617386;--bg:#f4f7fa}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:#203244;font:14px Arial,sans-serif}
    main{max-width:560px;margin:48px auto;padding:28px 24px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 5px 18px #123c6612;text-align:center}
    header{margin:-28px -24px 24px;padding:22px 20px;background:linear-gradient(135deg,var(--navy),#236e9d);color:#fff;border-radius:10px 10px 0 0}
    h1{margin:0 0 6px;font-size:24px} header p{margin:0;color:#e8f2fa;line-height:1.4}
    main>p{color:var(--muted);line-height:1.5}
    nav{display:grid;gap:10px;margin-top:22px}
    a{display:block;padding:12px 16px;border-radius:5px;background:var(--blue);color:#fff;font-weight:700;text-decoration:none}
    a:hover{background:var(--navy)}
    @media(max-width:600px){main{margin:18px 12px;padding:22px 16px}header{margin:-22px -16px 20px;padding:18px 16px}h1{font-size:21px}}
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Jacky's Service Portal</h1>
      <p>Service support and customer care</p>
    </header>
    <p>Select the service you need.</p>
    <nav aria-label="Service links">
      <a href="/complaints/">Customer Complaint Registration</a>
      <a href="/portal/">Service Portal</a>
    </nav>
  </main>
</body>
</html>
